<!doctype html>
<html lang="ja" data-i18n-ephemeral>
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>ことばと記憶の試遊</title>
<link rel="stylesheet" href="experimental_word_llm_native.css"><link rel="stylesheet" href="experimental_word_llm_native_book.css"><link rel="stylesheet" href="experimental_word_llm_native_island.css">
<script defer src="experimental_word_island_boot.js"></script>
<script defer src="localization_catalog.js"></script><script defer src="localization_core.js"></script>
<script defer src="data.js"></script><script defer src="experimental_word_start_questions.js"></script>
<script defer src="experimental_word_island_navigation.js"></script><script defer src="experimental_word_llm_native_perception.js"></script><script defer src="experimental_word_llm_native_walk.js"></script><script defer src="experimental_word_llm_native_practice.js"></script><script defer src="experimental_word_llm_native_game.js"></script>
<script defer src="experimental_word_llm_native_scene.js"></script><script defer src="view_renderer.js"></script>
<script defer src="experimental_word_llm_native_drawing.js"></script><script defer src="experimental_word_llm_native_book.js"></script><script defer src="experimental_word_llm_native_stars.js"></script>
<script defer src="experimental_word_llm_native_voice_design.js"></script><script defer src="experimental_word_llm_native_voice.js"></script><script defer src="experimental_word_llm_native_voice_ui.js"></script>
<script defer src="experimental_word_llm_native_island_ui.js"></script>
<link rel="stylesheet" href="experimental_word_master_window.css"><link rel="stylesheet" href="experimental_word_llm_native_mentor.css"><script defer src="experimental_word_master_window.js"></script><script defer src="experimental_word_llm_native_mentor_ui.js"></script>
</head>
<body class="entry-active"><main>
<header><div><p class="eyebrow">ことばと記憶の試遊</p><h1>この子と、島で暮らす。</h1></div><select id="locale" aria-label="言語"><option value="ja">日本語</option><option value="en">English</option><option value="zh-CN">简体中文</option><option value="ru">Русский</option><option value="es-ES">Español</option><option value="pt-BR">Português</option><option value="de">Deutsch</option></select></header>
<section id="entry" hidden>
<button id="logo" type="button" aria-label="- クリックして開始 -"><canvas id="logo-canvas" width="1280" height="720" aria-hidden="true"></canvas></button>
<div id="title-menu" hidden><h1>AIテラリウム</h1><p>- 観測者の島 -</p><button id="new-game" type="button">はじめから</button><button id="continue-game" type="button" hidden>つづきから</button><section id="character-picker" hidden><h2>だれと過ごす？</h2><div id="character-list"></div><button id="picker-back" type="button">タイトルにもどる</button></section><p id="title-status" role="status" aria-live="polite"></p></div>
</section>
<section id="questions" class="cyber-document" hidden><canvas class="document-frame" aria-hidden="true"></canvas><p id="question-count"></p><p id="question-text" tabindex="-1"></p><div id="question-choices" class="question-options"></div></section>
<form id="setup" class="cyber-document" hidden><canvas class="document-frame" aria-hidden="true"></canvas><h2>はじめまして</h2><canvas id="appearance" width="200" height="180" aria-hidden="true"></canvas><div class="identity"><label>名前<input id="name" maxlength="100" required autocomplete="off"></label><label>一人称<input id="self" maxlength="100" required autocomplete="off"></label><label>あなたの呼び方<input id="player" maxlength="100" required autocomplete="off"></label></div><div id="setup-voice">
<section id="voice-panel" aria-label="この子の声"><label for="voice-choice">声をえらぶ</label><div class="voice-choices"><select id="voice-choice"></select><button id="voice-listen" type="button">声をきく</button><button id="voice-stop" type="button">声をとめる</button></div>
<details id="voice-design"><summary>声をつくる</summary><p id="voice-description" data-i18n-skip>小さく丸い、不思議な生き物の声をもとに、好きな特徴をえらぼう。</p><div id="voice-traits"></div><label for="voice-extra">もっと伝えたいこと（任意・300文字まで）</label><textarea id="voice-extra" maxlength="300" rows="3" placeholder="例：鈴のような響きを少し加えたい"></textarea><p>空欄でも、えらんだ特徴だけでつくれます。</p><div class="voice-choices"><button id="voice-make" type="button">声をつくってきく</button><button id="voice-reset" type="button">もとの特徴にもどす</button></div><p id="voice-confirm-help" data-i18n-skip>聞いて気に入ったら「この声にする」で決めよう。</p></details>
<label class="voice-enabled"><input id="voice-enabled" type="checkbox" checked>声でお話しする</label><button id="voice-apply" type="button">この声にする</button><p id="voice-status" role="status" aria-live="polite"></p></section>
</div><label for="signature">サイン</label><canvas id="signature" width="720" height="160" tabindex="0" aria-label="サイン"></canvas><button id="signature-clear" type="button">サインを消す</button><button id="sign" type="submit" disabled>サインする</button><button id="question-retry" type="button">書き直す</button></form>
<section id="play" hidden>
<nav aria-label="記憶の表示"><button id="tab-chat" aria-controls="chat-view" aria-pressed="true">会話</button><button id="tab-diary" aria-controls="diary-view" aria-pressed="false">日記</button><button id="tab-stars" aria-controls="stars-view" aria-pressed="false">星座</button><button id="back-title" type="button">タイトルにもどる</button></nav>
<details id="voice-menu"><summary>この子の声</summary><div id="play-voice"></div></details>
<details id="mentor-voice-menu" hidden><summary>冒険家の声</summary><div id="mentor-voice"></div></details>
<div id="workspace" class="world-layout">
<section id="terrarium"><div id="nameplate" data-i18n-skip></div><canvas id="gameCanvas" width="800" height="480"></canvas><div id="bubble" data-i18n-skip></div><div class="console"><label>体力<meter id="energy" min="0" max="1"></meter></label><label>満腹度<meter id="fullness" min="0" max="1"></meter></label><p id="activity"></p><button id="pause" type="button">一時停止</button></div></section>
<section id="chat-view" class="paper"><h2 id="character-name" data-i18n-skip></h2><p>今日は、どんなお話をしよう？</p><section id="inventory" hidden aria-labelledby="inventory-title"><h3 id="inventory-title">インベントリ</h3><div id="inventory-items" aria-live="polite"></div></section><div id="conversation" role="log" aria-live="polite"></div><form id="compose"><label for="input">この子に話しかける</label><textarea id="input" maxlength="4000" rows="3" required></textarea><div class="actions"><button id="send" type="submit">送信</button><button id="cancel" type="button" hidden>中止</button></div></form></section>
<section id="diary-view" class="paper" hidden><h2>日記</h2><div id="diary"></div><details><summary>会話の原文を見る</summary><div id="diary-originals"></div></details></section>
<section id="stars-view" class="night" hidden><h2>見えたものと、教わった言葉。</h2><p>星を選ぶと、原発言や実体験の根拠を読めます。語の候補は習得済みの知識とは分けています。</p><div id="stars"></div><div id="star-record" class="star-detail"></div></section>
</div></section><p id="status" role="status" aria-live="polite"></p>
</main></body></html>
